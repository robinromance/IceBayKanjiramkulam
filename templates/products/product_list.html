{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f6f9;
        }

        h2 {
            text-align: center;
            margin: 30px 0;
            color: #333;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            width: 90%;
            margin: 0 auto 50px auto;
        }

        .product-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #007BFF;
        }

        .product-price {
            font-size: 16px;
            color: #333;
            background: #e0f0ff;
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .no-products {
            text-align: center;
            color: #999;
            font-size: 16px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<h2>Our Products</h2>

<div class="product-container">
    {% for product in products %}
        <div class="product-card">
            <div class="product-name">{{ product.name }}</div>
            <div class="product-price">₹{{ product.price }}</div>
        </div>
    {% empty %}
        <div class="no-products">No products found</div>
    {% endfor %}
</div>

</body>
</html>
