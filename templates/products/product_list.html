<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Products</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #fffdf3;
            --surface: #ffffff;
            --surface-strong: #fff7d2;
            --accent: #f4d44d;
            --accent-dark: #c39104;
            --text: #2a2a28;
            --muted: #6b6b60;
            --border: rgba(46, 33, 9, 0.12);
            --shadow: 0 24px 60px rgba(38, 29, 7, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(180deg, #fffdfa 0%, #fff4c9 100%);
            color: var(--text);
        }

        .page-wrapper {
            width: min(1180px, calc(100% - 24px));
            margin: 0 auto;
            padding: 24px 0 40px;
        }

        .page-header {
            background: linear-gradient(135deg, #fffbe3 0%, #fff0af 100%);
            border: 1px solid var(--border);
            border-radius: 32px;
            box-shadow: var(--shadow);
            padding: 28px 24px;
            margin-bottom: 24px;
        }

        .page-title {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3rem);
            letter-spacing: -0.04em;
            line-height: 1.05;
        }

        .page-intro {
            margin: 0;
            color: var(--muted);
            font-size: 1rem;
            max-width: 720px;
            line-height: 1.7;
        }

        .filter-panel {
            background: var(--surface);
            border-radius: 28px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 42px rgba(37, 28, 6, 0.08);
            padding: 24px;
            margin-bottom: 24px;
        }

        .filter-heading {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .filter-heading h2 {
            margin: 0;
            font-size: 1.25rem;
            letter-spacing: 0.01em;
        }

        .filter-form {
            display: grid;
            gap: 16px;
        }

        .search-group {
            display: grid;
            gap: 12px;
        }

        .search-group label {
            font-size: 0.95rem;
            color: var(--muted);
            font-weight: 600;
        }

        .search-input {
            width: 100%;
            min-height: 48px;
            border-radius: 18px;
            border: 1px solid rgba(42, 42, 40, 0.15);
            background: #fff;
            padding: 0 18px;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 4px rgba(244, 212, 77, 0.16);
        }

        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 16px;
        }

        .filter-field {
            display: grid;
            gap: 10px;
        }

        .filter-field label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: 600;
        }

        .filter-field input,
        .filter-field select {
            border-radius: 16px;
            border: 1px solid rgba(42, 42, 40, 0.12);
            background: #fff;
            padding: 14px 16px;
            font-size: 0.98rem;
            color: var(--text);
            outline: none;
        }

        .filter-field input:focus,
        .filter-field select:focus {
            border-color: var(--accent-dark);
            box-shadow: 0 0 0 4px rgba(244, 212, 77, 0.14);
        }

        .button-row {
            display: flex;
            justify-content: flex-end;
        }

        .filter-button {
            min-height: 50px;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #f8d659 0%, #f4b800 100%);
            color: #2a2a28;
            font-weight: 700;
            font-size: 1rem;
            padding: 0 24px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 12px 24px rgba(247, 181, 31, 0.2);
        }

        .filter-button:hover,
        .filter-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 16px 26px rgba(247, 181, 31, 0.24);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        /* Finished product page summary (only show product count) */
        .finished-summary {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #fffdf1 0%, #fff7b0 100%);
            border: 1px solid rgba(192,160,45,0.14);
            border-radius: 28px;
            padding: 36px;
            box-shadow: 0 20px 48px rgba(94,67,18,0.06);
            text-align: center;
        }

        .finished-count {
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            color: #342904;
            margin: 0;
            letter-spacing: -0.02em;
        }

        .finished-sub { color: var(--muted); margin-top: 6px; font-size: 1rem; }

        .product-card {
            background: linear-gradient(180deg, #ffffff 0%, #fff9d4 100%);
            border-radius: 32px;
            border: 1px solid rgba(192, 160, 45, 0.18);
            padding: 24px;
            box-shadow: 0 28px 52px rgba(94, 67, 18, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .product-card:hover,
        .product-card:focus-within {
            transform: translateY(-4px);
            box-shadow: 0 34px 72px rgba(94, 67, 18, 0.12);
            background: linear-gradient(180deg, #fffdf1 0%, #fff7b0 100%);
        }

        .product-name {
            margin: 0 0 12px;
            font-size: 1.2rem;
            line-height: 1.2;
            color: #342904;
        }

        .product-price {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: #4a4119;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.72);
            border-radius: 999px;
            border: 1px solid rgba(255, 233, 109, 0.6);
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            font-size: 1rem;
            padding: 24px 0;
        }

        @media (max-width: 960px) {
            .page-wrapper {
                width: min(100%, calc(100% - 20px));
                padding: 18px 0 32px;
            }

            .filter-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Tablet / small desktop tweaks (covers Lenovo TB-X505X portrait width ~800px) */
        @media (max-width: 820px) {
            .page-wrapper { padding: 20px 12px 32px; }
            .page-header { padding: 24px 18px; }
            .page-title { font-size: clamp(1.6rem, 5.2vw, 2.4rem); }
            .filter-panel { padding: 18px; }
            .filter-heading h2 { font-size: 1.05rem; }
            .search-input, .filter-field input, .filter-field select { min-height: 56px; font-size: 1.05rem; padding: 12px 16px; }
            .filter-button { min-height: 56px; padding: 0 20px; font-size: 1.05rem; }
            .product-grid { grid-template-columns: 1fr; }
            .product-card { padding: 20px; }
        }

        @media (max-width: 680px) {
            .page-header,
            .filter-panel {
                padding: 20px;
            }

            .filter-heading {
                flex-direction: column;
                align-items: flex-start;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .product-card {
                padding: 22px;
            }

            .filter-button {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 2rem;
            }

            .filter-field input,
            .filter-field select,
            .search-input {
                font-size: 0.98rem;
            }
        }
    </style>
</head>
<body>
    <main class="page-wrapper">
        <section class="page-header">
            <h1 class="page-title">Lemon Luxe Shop</h1>
            <p class="page-intro">Enjoy a premium tablet shopping experience with soft lemon accents, large tap targets, and luxury product cards designed for your Lenovo device.</p>
        </section>

        <section class="filter-panel">
            <div class="filter-heading">
                <h2>Find the perfect product</h2>
            </div>

            <form method="get" class="filter-form">
                <div class="search-group">
                    <label for="search">Search products</label>
                    <input id="search" class="search-input" name="q" type="search" value="{{ search_query }}" placeholder="Type product name" autocomplete="off">
                </div>

                <div class="filter-grid">
                    <div class="filter-field">
                        <label for="min_price">Min price</label>
                        <input id="min_price" name="min_price" type="number" min="0" value="{{ min_price }}" placeholder="0" inputmode="numeric">
                    </div>

                    <div class="filter-field">
                        <label for="max_price">Max price</label>
                        <input id="max_price" name="max_price" type="number" min="0" value="{{ max_price }}" placeholder="Any" inputmode="numeric">
                    </div>

                        <div class="filter-field">
                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="all" {% if category == 'all' %}selected{% endif %}>All categories</option>
                            <option value="other" {% if category == 'other' %}selected{% endif %}>Others</option>
                            {% for option in category_options %}
                                <option value="{{ option }}" {% if category == option %}selected{% endif %}>{{ option }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="filter-field">
                        <label for="sort">Sort by</label>
                        <select id="sort" name="sort">
                            <option value="name" {% if sort == 'name' %}selected{% endif %}>Name</option>
                            <option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>Price low to high</option>
                            <option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>Price high to low</option>
                        </select>
                    </div>

                    <div class="filter-field button-row">
                        <button type="submit" class="filter-button">Update results</button>
                    </div>
                </div>
            </form>
        </section>

        <section class="product-grid">
            {# Finished product page: show only the total product count #}
            <div class="finished-summary" role="status" aria-live="polite">
                <div>
                    <p class="finished-count">{{ products|length }}</p>
                    <p class="finished-sub">total products</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
